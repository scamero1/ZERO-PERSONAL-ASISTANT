version: "3.8"
services:
  zero:
    build: .
    container_name: zero_app
    env_file:
      - .env
    volumes:
      - ./user_uploads:/app/user_uploads
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:8501:8501"  # expone solo localhost; Nginx hará reverse-proxy
    restart: unless-stopped

  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    env_file:
      - .env
    volumes:
      - .:/app
    expose:
      - "8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file:
      - .env
    volumes:
      - .:/app
    expose:
      - "8501"

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - flask
      - streamlit