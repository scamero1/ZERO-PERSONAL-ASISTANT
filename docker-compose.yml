version: "3.9"
services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    env_file:
      - .env
    volumes:
      - .:/app
    expose:
      - "8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file:
      - .env
    volumes:
      - .:/app
    expose:
      - "8501"

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - flask
      - streamlit